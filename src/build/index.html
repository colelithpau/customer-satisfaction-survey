<!DOCTYPE html>
	<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Survey Form</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
	<h1 id="title">Customer Satisfaction Survey</h1>
		<p id="description">We value your feedback! Please take a few minutes to complete this survey about your recent experience.</p>

	    	<form id="survey-form">
	    	<label id="name-label" for="name">Full Name:</label>
	    	<input type="text" id="name" name="name" placeholder="Enter your full name" required>

	    	<label id="email-label" for="email">Email Address:</label>
    		<input type="email" id="email" name="email" placeholder="Enter your email address" required>

    		<label id="number-label" for="number">Age:</label>
		    <input type="number" id="number" name="number" placeholder="Enter your age" min="13" max="120" required>

	    	<label for="dropdown">How did you hear about us?</label>
	    	<select id="dropdown" name="referral">
	    	<option value="">Select an option</option>
	    	<option value="social-media">Social Media</option>
    		<option value="friend">Friend or Family</option>
    		<option value="advertisement">Advertisement</option>
    		<option value="search-engine">Search Engine</option>
  		</select>

  		<fieldset>
	  	<legend>Would you recommend us to others?</legend>
	  	<input type="radio" id="recommend-yes" name="recommend" value="yes">
	  	<label for="recommend-yes">Yes</label>
	  	<input type="radio" id="recommend-no" name="recommend" value="no">
	  	<label for="recommend-no">No</label>
	  	</fieldset>

	  	<fieldset>
	  	<legend>What aspects of our service did you like? (Check all that apply)</legend>
	  	<input type="checkbox" id="quality" name="aspects" value="quality">
	  	<label for="quality">Product Quality</label>
	  	<input type="checkbox" id="service" name="aspects" value="service">
	  	<label for="service">Customer Service</label>
  		<input type="checkbox" id="price" name="aspects" value="price">
	  	<label for="price">Price</label>
	  	<input type="checkbox" id="convenience" name="aspects" value="convenience">
	  	<label for="convenience">Convenience</label>
  		</fieldset>

  		<label for="comments">Additional Comments:</label>
  		<textarea id="comments" name="comments" rows="4" placeholder="Please share any additional thoughts or suggestions"></textarea>

	  	<button type="submit" id="submit">Submit Survey</button>
		</form>
	</body>
</html>
